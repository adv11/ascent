name: Deploy to Firebase Hosting

# Issue #266 — this used to trigger the production deploy on its own `push:
# branches: [main]`, running fully in parallel with `ci.yml`'s own push-triggered
# run on the same commit and with no dependency between them. That meant CI
# passing only gated whether the PR merge *button* was clickable, not whether the
# resulting commit was safe to deploy — a direct push, an admin override, or
# simply CI finishing slower than this workflow could ship an untested commit to
# production with zero automated gating. Now the production-deploy job triggers
# on `workflow_run` keyed off "CI — PR Quality Gate" (ci.yml) *completing* on
# main, and only proceeds if that run's `conclusion` was `success` — see the
# `production-deploy` job below. Preview-channel PR deploys are unaffected: they
# still trigger directly off `pull_request` so reviewers see in-progress work
# regardless of check status.
on:
  workflow_run:
    workflows: ["CI — PR Quality Gate"]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]

# Allow the action to post preview-channel URLs as PR comments
permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  # ── PR preview deploy — unchanged, still fires regardless of check status ──
  preview-deploy:
    name: Firebase Hosting deploy (preview)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check deploy readiness
        id: ready
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SWITCHPREP_ADV26 }}
        run: |
          if [ -n "$SERVICE_ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  FIREBASE_SERVICE_ACCOUNT secret not set — deploy steps skipped"
            echo "   Add the secret in GitHub → Settings → Secrets and variables → Actions"
            echo "   See docs/architecture.md#cicd for setup instructions"
          fi

      - name: Write Firebase client config
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          DEPLOY_READY: ${{ steps.ready.outputs.ok }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            echo "$FIREBASE_CONFIG" > src/services/firebase.config.js
          elif [ "$DEPLOY_READY" = "true" ]; then
            echo "::error::FIREBASE_CONFIG secret not set — refusing to deploy with placeholder Firebase config. Add the secret in GitHub → Settings → Secrets and variables → Actions (see docs/architecture.md#cicd)."
            exit 1
          else
            echo "⚠️  FIREBASE_CONFIG secret not set — using placeholder config (no deploy will run, FIREBASE_SERVICE_ACCOUNT is also unset)"
            cp src/services/firebase.config.example.js src/services/firebase.config.js
          fi

      # PR → deploy to a temporary preview channel (expires in 7 days).
      # The action posts the preview URL as a PR comment automatically.
      - name: Deploy preview channel (PR)
        if: steps.ready.outputs.ok == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SWITCHPREP_ADV26 }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: pr-${{ github.event.number }}
          expires: 7d

  # ── Production deploy — gated on ci.yml passing on this exact commit ──────
  production-deploy:
    name: Firebase Hosting + database rules deploy (production)
    # Scoped tightly, not just to conclusion == 'success': a workflow_run event fires for
    # ANY run of a same-named workflow, including one triggered by a fork PR — restrict to
    # a push-triggered run, on this repo's own main branch, from this repo (not a fork).
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # Issue #189 — without this, two rapid pushes to main can trigger
    # overlapping deploy runs with no ordering guarantee: the
    # slower-starting-but-earlier-commit job could finish after the
    # newer-commit job, briefly serving an older commit as "live" right
    # after a newer one was already deployed. Queue instead of racing;
    # never cancel a deploy mid-flight (cancel-in-progress: false).
    concurrency:
      group: ${{ github.workflow }}-main
      cancel-in-progress: false

    steps:
      # Check out the exact commit CI just passed on, not whatever the
      # default ref resolves to for a workflow_run event.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Check whether the deploy secrets are available.
      # Secrets cannot be read in `if:` expressions directly, so we probe
      # via env vars and emit step outputs.
      #
      # Issue #190: a deploy only actually happens when FIREBASE_SERVICE_ACCOUNT
      # is set (see the deploy steps' `if:` below) — so FIREBASE_CONFIG being
      # unset is only dangerous when a deploy would otherwise proceed. It used
      # to fall back to the example placeholder file and only log a warning
      # regardless of whether a real deploy would follow, which meant a
      # cleared/misconfigured secret could silently deploy a fully
      # non-functional app (placeholder Firebase keys — every Auth/Database
      # call fails) straight to the live production channel, with nothing but
      # a workflow-log warning to notice it by. Now: if a deploy would run
      # (SERVICE_ACCOUNT set) but FIREBASE_CONFIG is missing, fail the job
      # outright instead of writing placeholder config. If no deploy would run
      # anyway (SERVICE_ACCOUNT unset, e.g. this repo today), a missing
      # FIREBASE_CONFIG is harmless — warn and continue, same as before.
      - name: Check deploy readiness
        id: ready
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SWITCHPREP_ADV26 }}
        run: |
          if [ -n "$SERVICE_ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  FIREBASE_SERVICE_ACCOUNT secret not set — deploy steps skipped"
            echo "   Add the secret in GitHub → Settings → Secrets and variables → Actions"
            echo "   See docs/architecture.md#cicd for setup instructions"
          fi

      # Write the client-side Firebase config from the GitHub Secret.
      # FIREBASE_CONFIG is a JSON object stored as a repository secret.
      - name: Write Firebase client config
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          DEPLOY_READY: ${{ steps.ready.outputs.ok }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            echo "$FIREBASE_CONFIG" > src/services/firebase.config.js
          elif [ "$DEPLOY_READY" = "true" ]; then
            echo "::error::FIREBASE_CONFIG secret not set — refusing to deploy with placeholder Firebase config. Add the secret in GitHub → Settings → Secrets and variables → Actions (see docs/architecture.md#cicd)."
            exit 1
          else
            echo "⚠️  FIREBASE_CONFIG secret not set — using placeholder config (no deploy will run, FIREBASE_SERVICE_ACCOUNT is also unset)"
            cp src/services/firebase.config.example.js src/services/firebase.config.js
          fi

      # Issue #448 — label-gated deploy skip. An intermediate phase PR (CI-green
      # but not yet a complete, shippable state — e.g. a mid-rollout phase of a
      # #416-shaped multi-PR effort) gets `deploy:hold` applied at PR-author time,
      # the same moment the type:/priority:/domain: labels are applied. Look up
      # the labels on whichever PR the just-passed commit belongs to and skip the
      # production `firebase deploy` steps below if `deploy:hold` is present —
      # CI, tests, and the PR preview channel are unaffected either way. Fails
      # safe: if the PR lookup itself can't resolve an associated PR (e.g. a
      # direct-commit edge case, though branch protection should prevent this),
      # treat it as held rather than guessing — skip the deploy, don't error the
      # job, and don't silently ship an unverified commit.
      #
      # Issue #458 — the original version of this step conflated "the PR lookup
      # itself failed" with "the PR was found but simply has no labels at all,"
      # both under a single `[ -z "$LABELS" ]` check on the *extracted label
      # list*. Since PRs in this repo are almost never labeled at all (only
      # issues carry the type:/priority:/domain: taxonomy — see root CLAUDE.md),
      # `jq '.[].labels[].name'` legitimately produces empty output for nearly
      # every real PR, which the old check couldn't distinguish from a failed
      # `gh api` call — so the fail-safe fired on every single merge since #448
      # shipped, silently skipping the real `firebase deploy` step below while
      # the job still reported overall success. Confirmed live: production sat
      # on a build several merges/CACHE_VERSION bumps behind `main` for hours
      # with every "Deploy to Firebase Hosting" run showing green the whole
      # time — nothing in the Actions UI surfaced this on its own. Fixed by
      # checking the *raw PR lookup* (did `gh api` succeed, and did it find at
      # least one PR for this commit) completely separately from whether that
      # PR's own label list happens to contain `deploy:hold` — an empty label
      # list on a successfully-resolved PR is a normal, common, not-held state.
      #
      # A second, independent bug found while verifying the fix above: piping
      # the API response through a bash variable and `echo` (`echo "$VAR" |
      # jq ...`) corrupts any JSON string field containing a literal `\n`
      # escape (e.g. a multi-paragraph PR body/description, which every real
      # PR in this repo has) — this shell's `echo` interprets `\n` as an
      # actual newline byte before `jq` ever sees it, breaking the JSON
      # structure and making `jq` fail to parse it at all. Reproduced directly
      # against this repo's own PR #457. Writing the response straight to a
      # file with `gh api ... > file` and having every `jq` call read from
      # that file (never round-tripping the raw JSON through a shell
      # variable/echo) sidesteps the whole class of shell-escaping bugs.
      - name: Check deploy:hold label
        id: hold-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set +e
          gh api "repos/${{ github.repository }}/commits/$SHA/pulls" > /tmp/commit-prs.json 2>/dev/null
          STATUS=$?
          PR_COUNT=$(jq 'length' /tmp/commit-prs.json 2>/dev/null)
          if [ $STATUS -ne 0 ] || [ -z "$PR_COUNT" ] || [ "$PR_COUNT" -eq 0 ]; then
            echo "⚠️  Could not resolve a PR for $SHA — skipping deploy as a fail-safe."
            echo "hold=true" >> "$GITHUB_OUTPUT"
          elif jq -e '[.[].labels[].name] | index("deploy:hold")' /tmp/commit-prs.json >/dev/null 2>&1; then
            echo "⏸️  deploy:hold label present — skipping production deploy for this commit."
            echo "hold=true" >> "$GITHUB_OUTPUT"
          else
            echo "hold=false" >> "$GITHUB_OUTPUT"
          fi

      # main push, CI green, not held → deploy to the live production channel.
      - name: Deploy to production (main)
        if: steps.ready.outputs.ok == 'true' && steps.hold-check.outputs.hold != 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SWITCHPREP_ADV26 }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live

      # Issue #153 root cause #5 — firebase/database.rules.json was previously
      # ONLY ever deployed by someone manually running `firebase deploy
      # --only database` locally (root CLAUDE.md's own "Deploying" section
      # documented this as manual-only). That meant the rules actually
      # enforced against the live project could silently drift arbitrarily
      # far from what's in this repo, with no CI signal — a stale ruleset
      # rejecting a write to a newer path/field is indistinguishable, from a
      # user's perspective, from any other "Save failed" error. Deploying
      # rules on every push to main (same trigger as hosting, above) closes
      # that gap; firebase-tools authenticates via
      # GOOGLE_APPLICATION_CREDENTIALS pointing at the same service-account
      # JSON already used for the hosting deploy above, no new secret needed.
      - name: Deploy database rules (main)
        if: steps.ready.outputs.ok == 'true' && steps.hold-check.outputs.hold != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SWITCHPREP_ADV26 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools@latest deploy --only database --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
